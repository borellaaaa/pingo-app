<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Pingo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pingo">
<meta name="application-name" content="Pingo">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Pingo - Assistente da Terrão TV: agenda de campeonatos, caixa da temporada e equipe.">

<style>
@font-face{font-family:Fredoka;font-weight:500;font-display:block;src:url(fonts/fredoka-latin-500-normal.woff2) format('woff2'),url(fonts/fredoka-latin-ext-500-normal.woff2) format('woff2')}
@font-face{font-family:Fredoka;font-weight:600;font-display:block;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Fredoka;font-weight:700;font-display:block;src:url(fonts/fredoka-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Nunito;font-weight:600;font-display:block;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Nunito;font-weight:700;font-display:block;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Nunito;font-weight:800;font-display:block;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Nunito;font-weight:900;font-display:block;src:url(fonts/nunito-latin-900-normal.woff2) format('woff2')}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#2563eb;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{position:absolute;top:0;left:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden}
#erro{position:fixed;left:12px;right:12px;bottom:12px;z-index:99;display:none;background:#9a3412;color:#fff;font:800 13px Nunito,sans-serif;padding:10px 12px;border-radius:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="erro" role="alert"></div>
<script>
window.addEventListener('error', function (e) {
  var b = document.getElementById('erro');
  b.textContent = 'Erro: ' + (e.message || e);
  b.style.display = 'block';
  setTimeout(function () { b.style.display = 'none'; }, 6000);
});
</script>
<script src="app.js?v=1794345529"></script>
</body>
</html>
